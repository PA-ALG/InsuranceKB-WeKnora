- 字段名: 费用垫付
  取值: 住院垫付
  英文名: '医疗险提供的费用垫付服务是指在医疗保险定点医院住院时，医疗险参保人可向保险公司申请先行垫付住院费用，申请后保险公司会进行审核，审核通过后会垫付医疗费用，后续可由被保险人办理报销手续。


    需要注意的是：


    大多医疗险的垫付功能，是全国二级以上的公立医院，个别的产品还会限制城市。

    住院前先给保险公司电话报案，提出垫付申请。收到申请后，保险公司会要求提供一些证明文件，进而做评定，符合条件的才会垫付。

    垫付额度取决于疾病种类以及治疗费用，情况不同垫付额度也不同。'
