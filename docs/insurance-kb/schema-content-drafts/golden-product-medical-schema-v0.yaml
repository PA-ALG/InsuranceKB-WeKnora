# =====================================================================
# Golden Product 医疗险字段语义合同 —— 内容草案（DRAFT，非权威）
# 供保险领域专家评审；冻结后才进入 P5a1 SchemaVersion registry 内容（G0a）
# =====================================================================
status: DRAFT
authority: none  # 未经专家评审冻结前不得作为 SchemaVersion 内容、抽取模板或发布依据
draft_id: golden-product-medical-schema-v0
draft_date: '2026-07-27'
decision_anchor: 'D2=B + D11=A（2026-07-27 裁决）：仅做内容起草供专家评审；不写代码、不做迁移'
golden_product:
  name: 平安e生保（尊享版）医疗保险
  reference: '033 §14.1 G0 Golden Product'
  dataset_dir: dataset/shouxian_product/平安e生保（尊享版）医疗保险/
  dataset_files: [保险条款.pdf, 产品说明书.pdf, 费率表.pdf, product_meta.json]
  product_meta_snapshot:
    planCode: '596'
    versionNo: '596-1'
    planPlanType: 普通型
    planSalesStatus: 在售
    planSalesChannel: '个人代理、电话销售'
    startDate: '2025-09-08'
    reportPreparedFileCode: '平保寿发〔2025〕404号'
    sccode: '平安人寿〔2025〕医疗保险172号'
baseline_inputs:
  - docs/insurance-kb/schema-baseline/base.yaml            # 基础字段 35（全险种通用，医疗产品同样适用）
  - docs/insurance-kb/schema-baseline/medical.yaml         # 医疗险 24
  - docs/insurance-kb/schema-baseline/extensions-v1.1.yaml # 适用扩展 12 = 基础扩展 9 + 医疗险扩展 3
conventions:
  value_type_vocab: [bool, int, decimal, money, percentage, duration, date, enum, entity_ref, text_short, text_long]
  unit_vocab: '天 / 年 / 元 / percent / 件'
  comparator_rule: 'bool、单值enum、代码类text_short→exact_scalar；int/decimal/money/percentage/duration→numeric_tolerance_zero；date→date；区间值→interval；多值集合→enum_set；实体引用→entity_ref；text_long 及语义未闭合字段→text_keypoints_unknown（运行时 comparator 恒返回 unknown→进入人工复核；033 §8.2 comparator 三态 equal/different/unknown）'
  three_state: '所有字段一律三态 present/absent_explicitly/unknown（03 §2.3.1）；unknown≠absent_explicitly；absent_explicitly 必须自带证据；免责/豁免类字段的 absent_explicitly 语义在 absent_explicitly_note 单独说明'
  provenance_mapping: '取值来源列机械映射草案：产品条款/产品说明书/保险责任/免责条款→source_evidence；人工填充/人工填写→human_attestation；根据…计算/映射/推断/判断、LLM生成→derived；官网同步/口袋E/产品芯/核保系统/运营清单→external_sync；空白→undefined。该映射是机械草案，每个 undefined 行都需要业务答复'
  mvp_publishable_rule: '仅 provenance_class=source_evidence 为 true。依据 033 §10.5（派生结论本轮不升级为可查询事实）与 §8.1（可发布事实只允许 source_evidence/human_attestation/external_attestation 三种封闭 kind——而基线的人工填充列尚不是带 receipt 的 HumanAttestation，系统同步列尚不是受控 connector 的 ExternalAttestation）'
  risk_rule: '高风险族草案=豁免/等待期/除外(免责)/理赔限制(含免赔、社保限制、医院范围、补偿原则、续保保证、既往症)/给付比例(含给付限额、责任存在性)。族边界为起草判断，须专家逐字段确认；extensions-v1.1 已带明示 risk_level 的字段按原值保留'
  required_qualifier_semantics: 'required=true 为草案标记；一旦冻结，required qualifier 缺失时该 assertion 记 applicability_unknown，阻断自动 merge 与 machine_auto（033 §8.2）。standard_dims 指 jurisdiction/audience/channel 三个标准维度；qualifier 值只允许 exact scalar、排序去重 enum/entity 集或闭合 numeric/date 区间'
  enum_status_vocab: 'closed_draft_from_baseline=取值列给出的闭集草案；open_draft=取值列仅为示例或含推断补值(非闭集)；undefined=需受控目录，尚无草案值'
fields:
  # ================= 基础字段（base.yaml，35） =================
  - field_id: product_code
    display_name: 险种代码
    baseline_file: base.yaml
    baseline_value_source: 官网同步
    value_type: text_short
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: exact_scalar
    provenance_class: external_sync
    mvp_publishable: false
    extraction_notes: '官网/销售系统产品编码，文档内不必然出现；数据集 product_meta.json(planCode=596) 可作对账参考'
    expert_questions:
      - 'external_sync 类字段（官网/口袋E/产品芯/核保系统）在 Golden 数据集中没有任何导出物：G0a 对这类字段是引入受控 connector+ExternalAttestation，还是显式标注不可评估？（本问题适用于全部 7 个 external_sync 字段）'
      - '险种代码与产品主数据 product_code（ProductRegistry 铸造身份）重复：应作为主数据属性还是 Claim？'
  - field_id: product_short_name
    display_name: 险种简称
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: text_short
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: exact_scalar
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '通常为运营命名口径；文档封面不必然含简称'
    expert_questions:
      - '取值来源空白：简称由运营系统给出还是可锚定官网/说明书？需业务答复'
  - field_id: product_name
    display_name: 险种名称
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: text_short
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: exact_scalar
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '条款/说明书封面标题即全称，可回验'
    expert_questions:
      - '取值来源空白，但条款封面必有全称：确认改锚产品条款(source_evidence)并留痕'
      - '与 ProductRegistry canonical_name 关系：产品身份由主数据铸造（033 §8.2），该字段值不得另立身份，只作展示/对账？'
  - field_id: sales_start_date
    display_name: 开始使用时间
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: date
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: date
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '销售口径日期，通常来自销售系统；注意与条款生效日期(clause_effective_date)不是一回事（v1.1 B-2 明示区分）'
    expert_questions:
      - '取值来源空白（推测口袋E/运营系统）：需业务答复'
  - field_id: sales_end_date
    display_name: 结束使用时间
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: date
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: date
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '销售口径日期，通常来自销售系统；在售产品预期 unknown 或开放'
    expert_questions:
      - '取值来源空白：需业务答复；在售产品该字段的三态口径（unknown vs 开放区间）需冻结'
  - field_id: product_line
    display_name: 产品类别
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: enum
    enum_status: open_draft
    enum_values: [医疗险, 重疾险, 定期寿险, 终身寿险, 年金险, 两全保险, 意外险, 意外医疗险, 护理保险, 失能收入损失保险, 补充养老保险]
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: exact_scalar
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '草案枚举自基线 13 个险种 sheet 推断（非取值列）；条款名称与备案分类可回验'
    expert_questions:
      - '险种分类闭集与命名需确认（该枚举为起草推断，非基线取值列内容）；与 schema 险种路由的一致性'
  - field_id: product_design_type
    display_name: 产品类型
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: enum
    enum_status: open_draft
    enum_values: [普通型, 分红型, 万能型, 投资连结型]
    three_state_policy: tri_state
    risk_level: medium
    required_qualifiers: []
    comparator_class: exact_scalar
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '草案枚举为行业通识推断；product_meta.json 观察值为 普通型；分红型会联动 v1.1 分红扩展字段'
    expert_questions:
      - '取值来源空白；设计类型闭集需确认（万能/投连是否在本库范围内）'
  - field_id: sales_channels
    display_name: 销售渠道
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: enum
    multi_valued: true
    enum_status: open_draft
    enum_values: [个人代理, 电话销售, 银行保险, 互联网, 团险渠道]
    three_state_policy: tri_state
    risk_level: medium
    required_qualifiers: []
    comparator_class: enum_set
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '草案枚举含 product_meta 观察值（个人代理、电话销售）+行业通识补值；通常为运营口径'
    expert_questions:
      - '销售渠道与 AssertionApplicabilityV1 的 channel_ids 标准维度以及 ProductVersion.channels 外层包络重叠：应作为产品版本包络属性而非独立 Claim？（033 §8.2）'
  - field_id: published_external
    display_name: 发布外网
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: bool
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: exact_scalar
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '运营发布标记，文档内无'
    expert_questions:
      - '取值来源空白：需业务答复；是否属于产品知识库范畴（偏运营配置）'
  - field_id: sales_status
    display_name: 销售状态
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: enum
    enum_status: open_draft
    enum_values: [在售, 停售]
    three_state_policy: tri_state
    risk_level: medium
    required_qualifiers: []
    comparator_class: exact_scalar
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '草案枚举含 product_meta 观察值（在售）；停售会联动高风险字段 停售后续保安排'
    expert_questions:
      - '闭集确认（是否有 待售/暂停/归档 等状态）；与产品主数据 status 字段的权威关系'
  - field_id: primary_or_rider
    display_name: 主附加险
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: enum
    enum_status: open_draft
    enum_values: [主险, 附加险]
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: exact_scalar
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '条款名称含"附加"可判断，但那是 derived 规则；取值来源列本身空白'
    expert_questions:
      - '锚定方式裁决：按条款名称判断（derived）还是按条款投保范围表述抽取（source_evidence）？'
  - field_id: product_summary
    display_name: 产品简介
    baseline_file: base.yaml
    baseline_value_source: Kimichat生成
    value_type: text_long
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: text_keypoints_unknown
    provenance_class: derived
    provenance_note: 'LLM 生成物：非文档证据、非人工背书、非外部系统记录，机械归入 derived'
    mvp_publishable: false
    extraction_notes: '生成式摘要；033 §10.5 规定自由摘要只能作为带引用的页面表现，不产生独立事实'
    expert_questions:
      - '确认降级：产品简介不作为 Claim，只作为页面渲染产物（带引用）；若保留为字段则需重新定义来源'
  - field_id: product_highlights
    display_name: 产品特色
    baseline_file: base.yaml
    baseline_value_source: 产品说明书
    value_type: text_long
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: text_keypoints_unknown
    provenance_class: source_evidence
    mvp_publishable: true
    extraction_notes: '说明书亮点区；authority level 2（03 §6.1），亮点表述不得覆盖条款口径'
    expert_questions:
      - '亮点式表述与条款口径冲突时的裁决展示（正式口径与辅助解释分离）需要冻结规则'
  - field_id: target_customer_group
    display_name: 适用人群
    baseline_file: base.yaml
    baseline_value_source: 人工填写
    value_type: text_short
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: text_keypoints_unknown
    provenance_class: human_attestation
    mvp_publishable: false
    extraction_notes: '人工归纳（基线说明：与客户收入相关）；无受控目录前无法机器比较'
    expert_questions:
      - '基线说明"和收入保留一个"：与 产品档次 二选一还是并存？需业务裁决'
  - field_id: policyholder_rights
    display_name: 保单权益
    baseline_file: base.yaml
    baseline_value_source: 产品条款
    value_type: text_long
    three_state_policy: tri_state
    risk_level: medium
    required_qualifiers: []
    comparator_class: text_keypoints_unknown
    provenance_class: source_evidence
    mvp_publishable: true
    extraction_notes: '条款中合同解除/宽限/复效/转换等权益条目的汇编性字段'
    expert_questions:
      - '长文本汇编与结构化字段（犹豫期/宽限期/复效等）重叠：保留为页面知识还是拆解为结构化字段的聚合视图？'
  - field_id: eligible_services
    display_name: 可享服务
    baseline_file: base.yaml
    baseline_value_source: 三大服务对应的产品清单
    value_type: enum
    multi_valued: true
    enum_status: open_draft
    enum_values: [臻享RUN健康管理服务, 居家养老, 高端康养]
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: enum_set
    provenance_class: external_sync
    provenance_note: '运营侧服务-产品对应清单，机械归入 external_sync'
    mvp_publishable: false
    extraction_notes: '按运营清单同步；说明书可能提及但清单是权威'
    expert_questions:
      - '清单来源系统与更新机制确认；与医疗险字段 增值服务(value_added_services) 的边界划分'
  - field_id: premium_payment_term
    display_name: 交费期限
    baseline_file: base.yaml
    baseline_value_source: 口袋E
    value_type: enum
    multi_valued: true
    enum_status: open_draft
    enum_values: [10年交, 15年交, 20年交, 30年交]
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: enum_set
    provenance_class: external_sync
    mvp_publishable: false
    extraction_notes: '示例值源自基线取值列（寿险导向）；医疗险典型口径（如1年交/趸交）不在示例中，闭集必须重定义；说明书/费率表含可回验信息'
    expert_questions:
      - '闭集重定义（医疗险口径）；可从说明书/费率表抽取时是否改锚 source_evidence？'
  - field_id: premium_payment_mode
    display_name: 交费方式
    baseline_file: base.yaml
    baseline_value_source: '口袋E，产品说明书包含部分内容'
    value_type: enum
    multi_valued: true
    enum_status: closed_draft_from_baseline
    enum_values: [趸交, 年交, 半年交, 季交, 月交]
    three_state_policy: tri_state
    risk_level: low
    required_qualifiers: []
    comparator_class: enum_set
    provenance_class: external_sync
    provenance_note: '混合来源：主来源口袋E→external_sync；说明书部分可回验'
    mvp_publishable: false
    extraction_notes: '说明书投保须知/费率表表头常含交费方式'
    expert_questions:
      - '混合来源拆分：说明书可抽取子集是否改锚 source_evidence 使该字段部分可发布？'
  - field_id: hesitation_period
    display_name: 犹豫期
    baseline_file: base.yaml
    baseline_value_source: 产品条款
    value_type: duration
    unit: 天
    three_state_policy: tri_state
    absent_explicitly_note: '一年期医疗险条款可能不设犹豫期；absent_explicitly 须以条款明确不设或合同解除条无犹豫期约定的证据支持，不得由未抽到推定'
    risk_level: medium
    required_qualifiers: []
    comparator_class: numeric_tolerance_zero
    provenance_class: source_evidence
    mvp_publishable: true
    extraction_notes: '条款犹豫期/合同解除条；与长文本字段 犹豫期及合同解除（退保） 重叠'
    expert_questions:
      - '犹豫期是否并入高风险族（消费者权益敏感、监管强关注）？当前草案为 medium'
  - field_id: waiting_period
    display_name: 等待期
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: duration
    unit: 天
    three_state_policy: tri_state
    absent_explicitly_note: '等待期0天或续保无等待期是 present（值0/续保限定），不是 absent_explicitly；只有条款明确不设等待期才可标 absent_explicitly'
    risk_level: high
    high_risk: true
    risk_rationale: 等待期族
    required_qualifiers:
      - {qualifier: benefit_or_disease_type, kind: field_qualifier, required: true, note: '等待期常按责任/疾病类型不同（意外伤害医疗通常不受等待期限制）'}
      - {qualifier: renewal_status, kind: field_qualifier, required: true, note: '首年投保 vs 连续续保的等待期口径不同'}
    comparator_class: numeric_tolerance_zero
    provenance_class: undefined
    provenance_note: '基线取值来源列为空→机械映射 undefined；高风险核心字段因此暂不可发布'
    mvp_publishable: false
    extraction_notes: '条款等待期条，医疗险多位于保险责任的前置条件段'
    expert_questions:
      - '取值来源空白：确认改锚产品条款(source_evidence)并留痕——否则该高风险字段无法进入 MVP 发布与 G0a 全字段标注'
  - field_id: grace_period
    display_name: 宽限期
    baseline_file: base.yaml
    baseline_value_source: ''
    value_type: duration
    unit: 天
    three_state_policy: tri_state
    absent_explicitly_note: '趸交/一年期形态下宽限期可能不适用；absent_explicitly 需条款证据'
    risk_level: medium
    required_qualifiers:
      - {qualifier: payment_mode, kind: field_qualifier, required: false, note: '期交才有宽限期语义'}
    comparator_class: numeric_tolerance_zero
    provenance_class: undefined
    mvp_publishable: false
    extraction_notes: '条款保险费支付/宽限期条'
    expert_questions:
      - '三态无 N/A 表示：一年期医疗产品不适用的字段用 absent_explicitly 还是从该险种 schema slice 排除？需统一裁决（同题涉及 复效/减额缴清/费率可调）'
      - '取值来源空白：确认改锚产品条款'
  - field_id: covered_risks
    display_name: 可覆盖风险
    baseline_file: base.yaml
    baseline_value_source: '保障内容来做映射？'
    value_type: enum
    multi_valued: true
    enum_status: undefined
    enum_values: []
