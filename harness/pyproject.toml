[project]
name = "insurance-harness"
version = "0.1.0"
description = "寿险知识编译 Harness——WeKnora 插件式扩展（docs/insurance-kb/02-architecture.md ADR-001）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
# 金标注真实模型调用（spec G5：CI 不装此组，LiteLLMClient 延迟导入）
llm = ["litellm>=1.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint.isort]
# 显式声明第一方包：ruff 的 src 自动探测在 CI 与本地可能漂移（CI 曾把 insurance_harness 判为第三方致 I001 误报）
known-first-party = ["insurance_harness", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "langfuse.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: 打真实 WeKnora 测试实例的契约测试（需 HARNESS_LIVE_* 环境变量，默认跳过）",
]
