      - frontend/src/views/knowledge/wiki/WikiBrowser.vue
      - frontend/src/views/knowledge/wiki/ManagedWikiProposalEditor.vue
    owner: P14-proposal-edit-ux
    rationale: >-
      Route managed Wiki edits to the LLM Wiki ChangeProposal API with an exact
      base release/page revision; never mutate a published managed page directly.
    compatibility_tests:
      - stale base release or page revision is rejected
      - managed edit creates a Proposal and never calls ordinary page update
      - proposal status and regenerated Candidate are visible
      - unmanaged Wiki edit behavior remains compatible
    upstream_issue: pending-P14-contract-card
    remove_when: >-
      Remove after the equivalent generic managed-page proposal integration is
      accepted upstream and no fork-only Vue or API adapter remains.
    status: planned
