      - migrations/enterprise/versioned/000002_release_falsification.up.sql
      - migrations/enterprise/versioned/000002_release_falsification.down.sql
    owner: S0R-weknora-release-falsification
    rationale: >-
      Falsify whether WeKnora can own the sole serving Active Release through
      one bounded experimental Release path without creating a Harness Head or
      a general publication framework.
    compatibility_tests:
      - closed canonical authorization and exact idempotent receipt retry
      - PostgreSQL same-base activation has one winner and zero loser residue
      - current and pinned reads never mix releases during activation
      - current Wiki and RAW ACL shrink fails closed
      - active-managed Wiki rejects ordinary PUT and DELETE
      - unmanaged Wiki behavior remains compatible
    upstream_issue: not-filed-experimental-carrier-falsification
    remove_when: >-
      Remove or replace after an accepted upstream release exposes equivalent
      immutable Release activation, pinned reads, dual current ACL checks and
      managed Wiki mutation fencing, and the same compatibility vectors pass.
    status: experimental

  - patch_id: P11
    upstream_sha: 5eefa70e6fc8f9ec27958779f91ece6cf685598c
    file_path:
      - internal/types/wiki_page.go
      - internal/application/repository/wiki_page.go
      - internal/application/service/wiki_page.go
      - internal/handler/wiki_page.go
      - internal/router/router.go
    owner: P11-managed-page-fencing
    rationale: >-
      Add a dedicated managed-wiki endpoint, owner and activation-epoch
      high-watermark so late projector writes and ordinary PUT/DELETE cannot
      bypass PostgreSQL Release authority.
    compatibility_tests:
      - lower activation epoch is rejected
      - same epoch requires the same page or tombstone digest
      - ordinary Wiki PUT and DELETE reject managed pages
      - managed reads enforce the current RAW KnowledgeBase ACL
      - ordinary unmanaged Wiki behavior remains compatible
    upstream_issue: pending-P11-contract-card
    remove_when: >-
      Remove after the same managed-page fencing and RAW ACL read guard ship in an
      accepted upstream release and all compatibility vectors pass unchanged.
    status: planned

  - patch_id: P13
