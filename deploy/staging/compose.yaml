# I2a local staging: the I2 topology (docs/design/slices/I2a-本机测试环境.md) in a separate colima
# profile. Images are copied from the live VM by staging.sh and referenced by local tags derived from
# their image IDs, so nothing is pulled. Secrets come from env files under $STAGING_HOME, which
# staging.sh writes outside any repository; this file holds no secret values.
name: insurancekb-staging

x-restart: &restart
  restart: unless-stopped
  pull_policy: never

services:
  pg:
    <<: *restart
    image: ${STAGING_PG_IMAGE:?run staging.sh images first}
    env_file: ${STAGING_HOME:?}/pg.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 60

  redis:
    <<: *restart
    image: ${STAGING_REDIS_IMAGE:?run staging.sh images first}
    env_file: ${STAGING_HOME:?}/redis.env
    entrypoint: ["/bin/sh"]
    command: ["-ceu", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    networks: [internal]

  docreader:
    <<: *restart
    image: ${STAGING_DOCREADER_IMAGE:?run staging.sh images first}
    env_file: ${STAGING_HOME:?}/docreader.env
    volumes:
      - docreader-tmp:/tmp/docreader
    networks: [internal]

  app:
    <<: *restart
    image: ${STAGING_APP_IMAGE:?run staging.sh images first}
    env_file: ${STAGING_HOME:?}/app.env
    environment:
      DB_HOST: pg
      REDIS_ADDR: redis:6379
      DOCREADER_ADDR: docreader:50051
    volumes:
      - files:/data/files
      - c5:/run/insurancekb/c5:ro
      - docreader-tmp:/tmp/docreader:ro
      - ${STAGING_CONFIG_YAML:?}:/app/config/config.yaml:ro
      # contracts/ ships in the image (I5); staging.sh adds a mount only for a pre-I5 live app.
    networks: [internal, egress]
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_started
      docreader:
        condition: service_started

  ui:
    <<: *restart
    image: ${STAGING_UI_IMAGE:?run staging.sh images first}
    env_file: ${STAGING_HOME:?}/ui.env
    environment:
      APP_HOST: app
      APP_PORT: "8080"
      APP_SCHEME: http
    ports:
      - "127.0.0.1:${STAGING_UI_PORT:-18395}:80"
    networks: [internal, edge]
    depends_on:
      app:
        condition: service_started

networks:
  internal:
    internal: true
  egress: {}
  edge: {}

volumes:
  pgdata: {}
  files: {}
  c5: {}
  docreader-tmp: {}
