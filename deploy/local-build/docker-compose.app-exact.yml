services:
  app-smoke:
    image: ${BA0_APP_IMAGE:?BA0_APP_IMAGE must be an exact sha256 image ID}
    pull_policy: never
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    environment:
      AUTO_MIGRATE: "false"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        test -x /app/WeKnora
        test -d /app/config
        test -d /app/scripts
        test -d /app/migrations
        test -d /app/dataset/samples
        test -d /home/appuser/.duckdb
        test -e /app/LICENSE
        test -e /app/THIRD_PARTY_NOTICES.md
        test -d /app/licenses
        test -s /app/licenses/AnyDoc-MIT.txt
        test -x /opt/weknora/browserskill/bsk
        test -e /opt/weknora/browserskill/browser-skill-weknora-0.3.1.zip
        test -e /opt/weknora/browserskill/BrowserSkill-LICENSE
        python3 /app/scripts/verify-browserskill-extension.py /opt/weknora/browserskill/browser-skill-weknora-0.3.1.zip 0.3.1
        ldd /app/WeKnora > /tmp/ba0-ldd.out
        ! grep -q 'not found' /tmp/ba0-ldd.out
        ldd /opt/weknora/browserskill/bsk > /tmp/ba0-browserskill-ldd.out
        ! grep -q 'not found' /tmp/ba0-browserskill-ldd.out
        sleep infinity
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          set -eu;
          test -x /app/WeKnora;
          test -d /app/config;
          test -d /app/scripts;
          test -d /app/migrations;
          test -d /app/dataset/samples;
          test -d /home/appuser/.duckdb;
          test -e /app/LICENSE;
          test -e /app/THIRD_PARTY_NOTICES.md;
          test -d /app/licenses;
          test -s /app/licenses/AnyDoc-MIT.txt;
          test -x /opt/weknora/browserskill/bsk;
          test -e /opt/weknora/browserskill/browser-skill-weknora-0.3.1.zip;
          test -e /opt/weknora/browserskill/BrowserSkill-LICENSE;
          python3 /app/scripts/verify-browserskill-extension.py /opt/weknora/browserskill/browser-skill-weknora-0.3.1.zip 0.3.1;
          ldd /app/WeKnora > /tmp/ba0-health-ldd.out;
          ! grep -q 'not found' /tmp/ba0-health-ldd.out;
          ldd /opt/weknora/browserskill/bsk > /tmp/ba0-health-browserskill-ldd.out;
          ! grep -q 'not found' /tmp/ba0-health-browserskill-ldd.out
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 1s
