# R2.1 fail-closed minimum. Image references match images.lock exactly.
services:
  frontend:
    image: wechatopenai/weknora-ui:v0.6.3@sha256:da9a3a0a939ddd1ed6f4b510b74a0562a21b898439f907cd6ee529a3680283d8
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    image: wechatopenai/weknora-app:v0.6.3@sha256:748097ccb5e9a66d46cfb94de9cd200de5a65dbd2ad7de917a5db0ffd4e56681
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    env_file: !override
      - .env.local-live.runtime

  docreader:
    image: wechatopenai/weknora-docreader:v0.6.3@sha256:7f09b7581150cec73a206460c859abfd3671ae13697450d6b533db5484c1276c

  postgres:
    image: paradedb/paradedb:v0.22.2-pg17@sha256:af585013f97f622715de01e48d00558f7edf17055d7b40deafc9f98ca8d99a56

  redis:
    image: redis:7.0-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set a random local Redis password}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  WeKnora-network:
    name: local-live-weknora
