# R2.1 fail-closed minimum. Image references match images.lock exactly.
services:
  frontend:
    image: ghcr.io/pa-alg/insurancekb-weknora-frontend:src-a8bf55ae1844-lock-55bb545f43a4@sha256:5e5555166307ab65f4b9b118766c778231c81a0b1aff2326c3da7a99f2527243
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    image: ghcr.io/pa-alg/insurancekb-weknora-app:src-a8bf55ae1844-lock-55bb545f43a4@sha256:37dfa969939cd9e48e4f65fcabee49920ecb28139d584bf000a2355ac5cf1d55
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    env_file: !override
      - path: .env
        required: false

  docreader:
    image: ghcr.io/pa-alg/insurancekb-weknora-docreader:src-a8bf55ae1844-lock-55bb545f43a4@sha256:418de99a454fdfee1592cc8346fad6f8e2601ed27107561aa745474d94b8b207

  postgres:
    image: paradedb/paradedb:v0.22.2-pg17@sha256:af585013f97f622715de01e48d00558f7edf17055d7b40deafc9f98ca8d99a56

  redis:
    image: redis:7.0-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set a random local Redis password}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  WeKnora-network:
    name: local-live-weknora
