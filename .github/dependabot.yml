# Security updates only for components maintained by this project.
# Setting the version-update limit to zero leaves security updates enabled.
# Repository administrators must enable Dependabot security updates in Settings.
# Harness uses the native uv ecosystem to maintain pyproject.toml and uv.lock:
# https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      server-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/docreader"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      docreader-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/harness"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      harness-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      gha-security:
        applies-to: security-updates
        patterns: ["*"]
