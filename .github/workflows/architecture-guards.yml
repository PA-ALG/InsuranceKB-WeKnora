name: architecture-guards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.26"

      # pytest and the exporter must run in the same locked environment. A
      # --no-dev sync omits pytest; system Python cannot see this venv's pydantic.
      - name: Install the Harness dependencies
        working-directory: harness
        run: uv sync --locked

      - name: Check architecture boundaries and detector self-tests
        env:
          PYTHONPATH: harness/src
        run: harness/.venv/bin/python -m pytest -q tests/architecture
