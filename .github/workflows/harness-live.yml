name: harness-live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: harness-live
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Preflight live environment
        env:
          HARNESS_LIVE_API_KEY: ${{ secrets.HARNESS_LIVE_API_KEY }}
          HARNESS_LIVE_DB_URL: ${{ secrets.HARNESS_LIVE_DB_URL }}
          HARNESS_LIVE_BASE_URL: ${{ vars.HARNESS_LIVE_BASE_URL }}
          HARNESS_LIVE_SPACE_ID: ${{ vars.HARNESS_LIVE_SPACE_ID }}
          HARNESS_LIVE_KNOWLEDGE_ID: ${{ vars.HARNESS_LIVE_KNOWLEDGE_ID }}
          HARNESS_LIVE_PARSER_FINGERPRINT: ${{ vars.HARNESS_LIVE_PARSER_FINGERPRINT }}
          HARNESS_LIVE_KB_ID: ${{ vars.HARNESS_LIVE_KB_ID }}
        run: |
          required=(
            HARNESS_LIVE_BASE_URL
            HARNESS_LIVE_API_KEY
            HARNESS_LIVE_DB_URL
            HARNESS_LIVE_SPACE_ID
            HARNESS_LIVE_KNOWLEDGE_ID
            HARNESS_LIVE_PARSER_FINGERPRINT
            HARNESS_LIVE_KB_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'missing live variable: %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          version: "0.9.26"
      - name: Install dependencies
        run: uv sync --locked
      - name: Tests (WeKnora live)
        env:
          HARNESS_LIVE_API_KEY: ${{ secrets.HARNESS_LIVE_API_KEY }}
          HARNESS_LIVE_DB_URL: ${{ secrets.HARNESS_LIVE_DB_URL }}
          HARNESS_LIVE_BASE_URL: ${{ vars.HARNESS_LIVE_BASE_URL }}
          HARNESS_LIVE_SPACE_ID: ${{ vars.HARNESS_LIVE_SPACE_ID }}
          HARNESS_LIVE_KNOWLEDGE_ID: ${{ vars.HARNESS_LIVE_KNOWLEDGE_ID }}
          HARNESS_LIVE_PARSER_FINGERPRINT: ${{ vars.HARNESS_LIVE_PARSER_FINGERPRINT }}
          HARNESS_LIVE_KB_ID: ${{ vars.HARNESS_LIVE_KB_ID }}
        run: uv run pytest -m live -q --junitxml=reports/live.xml
      - name: Require executed zero-skip live tests
        run: uv run python scripts/check_junit.py reports/live.xml
      - name: Upload live JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-live-junit
          path: harness/reports/live.xml
          if-no-files-found: ignore
