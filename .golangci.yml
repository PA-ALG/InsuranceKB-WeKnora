version: "2"
linters:
  enable:
    - lll           # 控制行宽
    - govet
    - revive
  settings:
    lll:
      line-length: 120
      tab-width: 4
  exclusions:
    paths:
      # swag embeds OpenAPI as single-line JSON strings; line-length is not meaningful.
      - docs/docs\.go$
    rules:
      # BEGIN U-1a 临时排除（U-1 阶段 a 收尾 PR 整段删除，连同本段新增的父键）：这些上游文件已逐字节回退到固定基线，
      # 其中的上游原样写法在本 PR 里会被 --new-from-merge-base 报成新问题。
      # 清单与 tests/architecture/u1a_reverted_files.txt 一一对应，不用目录通配。
      - path: '^cli/cmd/chat/chat_test\.go$'
        linters: [lll, revive, errcheck, staticcheck, unused, govet]
      - path: '^cli/cmd/message/list_test\.go$'
        linters: [lll, revive, errcheck, staticcheck, unused, govet]
      - path: '^cli/cmd/session/ask_test\.go$'
